[project]
name = "test-runner"
version = "3.0.10"
description = "Aetherion agent for executing Playwright-generated Python scripts as test suites"
authors = [{ name = "Calfus Inc.", email = "cloudops@calfus.com" }]
requires-python = ">=3.12.10,<3.13"

dependencies = [
    "aetherion-sdk==0.0.35",
    "boto3>=1.34.0",
    "openpyxl>=3.1.0",
    "playwright>=1.58.0",
]
# Note: do NOT pin steel-sdk here. aetherion-sdk 0.0.35 -> draco==0.0.46 pins
# steel-sdk==0.15.0 transitively (on Linux), which provides `from steel import Steel`
# for the gated Steel-browser path. An explicit steel-sdk>=0.17.0 conflicts with draco.

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.3.0",
    "pytest-cov==6.3.0",
    "ruff==0.12.12",
    "black==25.12.0",
]

# Extra index (not explicit) so aetherion-sdk + its CodeArtifact-only transitive
# deps AND ursa resolve from here, while PyPI still serves boto3/playwright/openpyxl.
# Auth: AWS SSO profile `aetherion` + UV_INDEX_CODEARTIFACT_* env vars.
[[tool.uv.index]]
name = "codeartifact"
url = "https://aetherion-285774563994.d.codeartifact.us-east-1.amazonaws.com/pypi/aetherion/simple/"

[tool.uv.sources]
aetherion-sdk = { index = "codeartifact" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src", "common_lib"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
