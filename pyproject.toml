[project]
name = "act-agent"
version = "4.0.23"
description = "ACT Agent — executes recorded UI automation scripts as a test suite and returns an HTML report"
authors = [{ name = "Calfus Inc.", email = "cloudops@calfus.com" }]
requires-python = ">=3.12.10,<3.13"
#this is v2
dependencies = [
    "aetherion-sdk==0.0.39",
    "boto3>=1.34.0",
    "openpyxl>=3.1.0",
    "playwright>=1.58.0",
]
# Note: do NOT pin steel-sdk here. aetherion-sdk -> draco transitively pins steel-sdk on Linux
# (under 0.0.35 that was draco==0.0.46 -> steel-sdk==0.15.0), which provides `from steel import
# Steel` for the gated Steel-browser path. An explicit steel-sdk>=0.17.0 conflicts with draco.
# Re-verify the exact draco/steel-sdk transitive pins with `uv lock` after each SDK version bump.

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.3.0",
    "pytest-cov==6.3.0",
    "ruff==0.12.12",
    "black==25.12.0",
]

# Extra index (not explicit) so aetherion-sdk + its CodeArtifact-only transitive
# deps AND ursa resolve from here, while PyPI still serves boto3/playwright/openpyxl.
# Auth: AWS SSO profile `aetherion` + UV_INDEX_CODEARTIFACT_* env vars.
[[tool.uv.index]]
name = "codeartifact"
url = "https://aetherion-285774563994.d.codeartifact.us-east-1.amazonaws.com/pypi/aetherion/simple/"

[tool.uv.sources]
aetherion-sdk = { index = "codeartifact" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src", "common_lib"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# helpers_v2.py is a re-export facade: it star-imports the .helpers package into a
# single namespace (so monkeypatching helpers_v2.X and shared _PTR_* state behave as
# in the original single module) and keeps urllib/experience imports that submodules
# consume via h-routing. F401/F403/F405 are inherent to that pattern, not dead code.
"src/runtime/helpers_v2.py" = ["F401", "F403", "F405"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
